      <stop offset="0%" stop-color="#F5F7FF"/>
      <stop offset="100%" stop-color="#E4EAFE"/>
    </linearGradient>
    <radialGradient id="cblob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
