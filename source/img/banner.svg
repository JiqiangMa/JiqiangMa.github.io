<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#F7F9FF"/>
      <stop offset="100%" stop-color="#EBF0FE"/>
    </linearGradient>

    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity=".20"/>
      <stop offset="55%" stop-color="#4F46E5" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#4F46E5" stroke-opacity=".06" stroke-width="1"/>
    </pattern>

    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1000" fill="url(#bg)"/>
  <rect width="1920" height="1000" fill="url(#grid)"/>

  <ellipse cx="330" cy="170" rx="640" ry="480" fill="url(#blobIndigo)"/>
  <ellipse cx="1640" cy="840" rx="720" ry="520" fill="url(#blobViolet)"/>
  <ellipse cx="1490" cy="110" rx="520" ry="360" fill="url(#blobCyan)"/>
  <ellipse cx="820" cy="900" rx="560" ry="300" fill="url(#blobIndigo)"/>

  <rect width="1920" height="1000" fill="url(#fade)"/>
</svg>
